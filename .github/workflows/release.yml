name: Publish Beta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Validate version and immutable release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'SentinelProfiles.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          $tag = "v$version"
          $entries = @(Get-Content -LiteralPath 'repo.json' -Raw | ConvertFrom-Json)
          if (@($entries | Where-Object InternalName -eq 'SentinelProfiles').Count -ne 1) {
            throw 'Root repo.json must contain exactly one SentinelProfiles entry.'
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "Release '$tag' already exists. Increment the version; existing releases are immutable."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore locked dependencies
        run: dotnet restore SentinelProfiles.csproj --locked-mode

      - name: Run core behavior tests
        run: dotnet run --project SentinelProfiles.Core.Tests/SentinelProfiles.Core.Tests.csproj -c Release

      - name: Build release package
        run: dotnet build SentinelProfiles.csproj -c Release --no-restore

      - name: Validate installable package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SentinelProfiles/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SentinelProfiles/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelProfiles.zip" -Force

      - name: Publish immutable GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelProfiles.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel Profiles ${{ steps.version.outputs.value }} beta" `
            --notes "Keeps Enable, Leave Alone, and Disable beside each other in the Profile State column at supported window widths, reducing plugin list scrolling in Sentinel Modern and Classic. Labels remain readable, and extra-narrow layouts still reflow. Profile rules and restart semantics are unchanged; in-game confirmation is pending." `
            --prerelease

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelProfiles.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelProfiles.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Publish authoritative child manifest and verify central catalog
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: SentinelProfiles
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}

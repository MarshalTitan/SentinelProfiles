name: Publish Beta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Validate version and immutable release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content -LiteralPath 'SentinelProfiles.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          $tag = "v$version"
          $entry = @(Get-Content -LiteralPath 'repo.json' -Raw | ConvertFrom-Json) | Select-Object -First 1
          if ($entry.InternalName -ne 'SentinelProfiles' -or $entry.AssemblyVersion -ne $version) {
            throw 'repo.json must contain SentinelProfiles at the project version before release.'
          }
          $expectedAsset = "https://github.com/MarshalTitan/SentinelProfiles/releases/download/v$version/SentinelProfiles.zip"
          if ($entry.DownloadLinkInstall -ne $expectedAsset) {
            throw "repo.json release URL does not match: $expectedAsset"
          }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "Release '$tag' already exists. Increment the version; existing releases are immutable."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore locked dependencies
        run: dotnet restore SentinelProfiles.csproj --locked-mode

      - name: Run core behavior tests
        run: dotnet run --project SentinelProfiles.Core.Tests/SentinelProfiles.Core.Tests.csproj -c Release

      - name: Build release package
        run: dotnet build SentinelProfiles.csproj -c Release --no-restore

      - name: Validate installable package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SentinelProfiles/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SentinelProfiles/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelProfiles.zip" -Force

      - name: Publish immutable GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' "$env:RUNNER_TEMP\SentinelProfiles.zip" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Sentinel Profiles ${{ steps.version.outputs.value }} beta" `
            --notes "Pins SentinelCore.UI 0.2.1 and adopts its corrected non-scrolling header and persistent left navigation rail. Classic, saved theme selection, profiles, window identity, and all switching behavior remain unchanged. Manual in-game validation remains required for each installed-plugin collection layout." `
            --prerelease

      - name: Verify public release asset
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelProfiles.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelProfiles.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              if ((Get-Item $download).Length -gt 0) { break }
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }
          ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Trigger central Sentinel catalog reconciliation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'DALAMUD_CATALOG_TOKEN is required to publish Sentinel Profiles to the central Sentinel catalog.'
          }

          $payload = @{
            event_type = 'plugin-released'
            client_payload = @{
              source_repository = '${{ github.repository }}'
              source_commit = '${{ github.sha }}'
              internal_name = 'SentinelProfiles'
              version = '${{ steps.version.outputs.value }}'
              tag = '${{ steps.version.outputs.tag }}'
            }
          } | ConvertTo-Json -Depth 5

          $payload | gh api `
            --method POST `
            'repos/MarshalTitan/Sentinel/dispatches' `
            --input -
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch the central Sentinel catalog reconciliation.'
          }

      - name: Verify public central Sentinel catalog
        shell: pwsh
        run: |
          $catalogUrl = 'https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json'
          $expectedVersion = '${{ steps.version.outputs.value }}'
          $expectedAsset = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelProfiles.zip"

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $catalog = @(Invoke-RestMethod -Uri "$catalogUrl`?release=${{ github.run_id }}-$attempt")
              $entry = @($catalog | Where-Object InternalName -eq 'SentinelProfiles')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq $expectedVersion `
                  -and $entry[0].TestingAssemblyVersion -eq $expectedVersion `
                  -and $entry[0].DownloadLinkInstall -eq $expectedAsset `
                  -and $entry[0].DownloadLinkUpdate -eq $expectedAsset `
                  -and $entry[0].DownloadLinkTesting -eq $expectedAsset) {
                Write-Host "Verified Sentinel Profiles $expectedVersion in the public central catalog."
                exit 0
              }
            }
            catch {
              Write-Host "Central catalog verification attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw "The public central Sentinel catalog did not reach Sentinel Profiles $expectedVersion within five minutes."

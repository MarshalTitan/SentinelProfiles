name: Publish Profiles 0.2.1.6 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-profiles-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Publish Beta workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
